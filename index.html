<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Driveaway rents hypercars, supercars and luxury cars in Ahmedabad. Pick a car, choose one of eight pickup hubs and your dates, and book online in minutes." />
    <meta name="theme-color" content="#0C0C0D" />
    <title>Driveaway — Premium Car Rentals Ahmedabad</title>

    <!-- Link previews (WhatsApp, social apps, chat tools). Crawlers do not run JavaScript, so these
         static tags are what every shared link shows. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Driveaway" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Driveaway — Premium Car Rentals Ahmedabad" />
    <meta property="og:description" content="Hypercars, supercars and luxury cars for hire in Ahmedabad. Pick a car, choose a pickup hub and your dates, and book online in minutes." />
    <meta property="og:image" content="/images/luxury_hypercars_header.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="Three hypercars parked in front of a modern house" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Driveaway — Premium Car Rentals Ahmedabad" />
    <meta name="twitter:description" content="Hypercars, supercars and luxury cars for hire in Ahmedabad. Pick a car, choose a pickup hub and your dates, and book online in minutes." />
    <meta name="twitter:image" content="/images/luxury_hypercars_header.webp" />
    <meta name="twitter:image:alt" content="Three hypercars parked in front of a modern house" />

    <!-- Apply saved theme before first paint (prevents a dark/light flash), and note whether this is the home page.
         vercel.json's Content-Security-Policy allows this script by its sha256 hash: after any change to the
         text between the script tags, recompute the hash and update script-src there. -->
    <script>
      try {
        var t = localStorage.getItem('driveaway_theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
      document.documentElement.setAttribute('data-first-route', location.pathname === '/' ? 'home' : 'page');
    </script>

    <!-- Fonts and photo hosts: connect early, load without blocking render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" />

    <!-- First-load skeleton: shown before the app's JavaScript arrives; React replaces it on start -->
    <style>
      body { margin: 0; }
      html { background: #ECEAE6; }
      html.dark { background: #0C0C0D; }
      .boot { --bone: rgb(17 17 19 / 0.08); --sheen: rgb(17 17 19 / 0.07); --line: #D6D2CB; min-height: 100vh; font-family: system-ui, sans-serif; }
      html.dark .boot { --bone: rgb(242 240 236 / 0.08); --sheen: rgb(242 240 236 / 0.08); --line: #2E2E32; }
      .boot-nav { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 max(16px, calc((100vw - 1280px) / 2 + 32px)); border-bottom: 1px solid var(--line); }
      .boot-logo { width: 36px; height: 36px; border-radius: 10px; background: #D0021B; }
      .boot-wrap { padding: 32px max(16px, calc((100vw - 1280px) / 2 + 32px)); }
      .boot-b { border-radius: 12px; background: var(--bone) linear-gradient(100deg, transparent 30%, var(--sheen) 50%, transparent 70%); background-size: 220% 100%; animation: boot-shimmer 1.6s ease-in-out infinite; }
      .boot-band { display: none; position: relative; overflow: hidden; height: calc(100vh - 72px); max-height: 830px; background: #1F3C88; }
      .boot-band .boot-b { --bone: rgb(255 255 255 / 0.16); --sheen: rgb(255 255 255 / 0.14); }
      html[data-first-route='home'] .boot-band { display: block; }
      html[data-first-route='home'] .boot-page { display: none; }
      .boot-row { display: flex; gap: 24px; margin-top: 32px; flex-wrap: wrap; }
      .boot-fan { position: absolute; left: max(16px, calc((100vw - 1280px) / 2 + 32px)); bottom: 0; display: flex; align-items: flex-end; }
      .boot-chip { width: 160px; height: 112px; border-radius: 18px 18px 0 0; margin-left: -8px; }
      @keyframes boot-shimmer { from { background-position: 130% 0; } to { background-position: -90% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-b { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>Driveaway needs JavaScript enabled to run.</noscript>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading Driveaway">
        <div class="boot-nav">
          <div style="display:flex;align-items:center;gap:10px"><div class="boot-logo"></div><div class="boot-b" style="width:120px;height:18px"></div></div>
          <div class="boot-b" style="width:96px;height:40px;border-radius:999px"></div>
        </div>
        <div class="boot-band">
          <div class="boot-wrap">
            <div class="boot-b" style="width:min(70%,760px);height:64px"></div>
            <div class="boot-b" style="width:min(88%,960px);height:64px;margin-top:12px"></div>
            <div class="boot-row">
              <div style="flex:1 1 360px;max-width:480px">
                <div class="boot-b" style="height:16px;width:92%"></div>
                <div class="boot-b" style="height:16px;width:70%;margin-top:8px"></div>
                <div class="boot-b" style="height:250px;margin-top:24px;border-radius:18px"></div>
              </div>
              <div class="boot-b" style="flex:1.4 1 380px;height:340px;border-radius:28px 28px 28px 96px"></div>
            </div>
          </div>
          <div class="boot-fan">
            <div class="boot-b boot-chip" style="margin-left:0;transform:translateY(14px)"></div>
            <div class="boot-b boot-chip" style="transform:translateY(-6px)"></div>
            <div class="boot-b boot-chip" style="transform:translateY(14px)"></div>
            <div class="boot-b boot-chip" style="transform:translateY(14px)"></div>
          </div>
        </div>
        <div class="boot-page boot-wrap">
          <div class="boot-b" style="width:min(60%,640px);height:64px;margin-top:24px"></div>
          <div class="boot-b" style="width:240px;height:16px;margin-top:16px"></div>
          <div class="boot-row">
            <div class="boot-b" style="flex:1 1 280px;height:300px;border-radius:18px"></div>
            <div class="boot-b" style="flex:1 1 280px;height:300px;border-radius:18px"></div>
            <div class="boot-b" style="flex:1 1 280px;height:300px;border-radius:18px"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
