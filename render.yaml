# Render Blueprint for the Driveaway API (Express + MongoDB).
# In Render: New + > Blueprint > pick this repository. Render reads this file,
# creates the web service and generates JWT_SECRET for you.
# You only fill in the values marked "sync: false" when Render asks for them.
services:
  - type: web
    name: driveaway-api
    runtime: node
    plan: free
    region: singapore          # closest Render region to Ahmedabad
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health   # 200 only while MongoDB is connected
    # Deploy a pushed commit only once its GitHub checks (.github/workflows/ci.yml) pass.
    # If that workflow is ever removed, change this to "commit", or deploys stop.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"            # pin the Node major so a platform default change can't break a deploy
      - key: JWT_SECRET
        generateValue: true    # Render creates a long random secret; you never see or type it
      - key: JWT_EXPIRE
        value: 7d
      - key: MONGO_URI
        sync: false            # your MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false            # your Vercel site, e.g. https://driveaway.vercel.app (CORS and links in emails)
      - key: VERCEL_PROJECT_PREFIX
        value: driveaway       # https://driveaway.vercel.app is allowed by CORS
      - key: PUBLIC_API_URL
        sync: false            # optional: this API's URL, e.g. https://driveaway-api.onrender.com (photo and unsubscribe links)
      # Booking emails. Render's free plan blocks SMTP, so email goes through Brevo's API (free: 300/day).
      - key: BREVO_API_KEY
        sync: false            # from Brevo: SMTP & API -> API keys
      - key: EMAIL_FROM
        sync: false            # the sender address you verified in Brevo
      - key: EMAIL_TEAM
        sync: false            # optional: where contact-form messages go (defaults to EMAIL_FROM)
